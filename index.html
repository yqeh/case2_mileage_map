<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 里程計算系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .project-block {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
        .project-header {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #0d6efd;
        }
        .record-row {
            padding: 10px;
            margin-bottom: 8px;
            background-color: white;
            border-radius: 4px;
            border-left: 3px solid #dee2e6;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-file-earmark-excel me-2"></i>
                Excel 里程計算系統
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="card mb-4" id="uploadSection">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-upload"></i> 步驟一：上傳 Excel 檔案</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="excelFile" class="form-label">選擇 Excel 檔案</label>
                            <input type="file" class="form-control" id="excelFile" accept=".xlsx,.xls">
                            <small class="form-text text-muted">支援格式：.xlsx, .xls</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fixedOrigin" class="form-label">固定起點地址（可選）</label>
                            <input type="text" class="form-control" id="fixedOrigin" placeholder="例如：高雄市前鎮區復興四路12號">
                            <small class="form-text text-muted">如果所有行程都從同一起點出發，可在此設定</small>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-primary" onclick="uploadExcel()">
                        <i class="bi bi-upload"></i> 上傳並解析
                    </button>
                    <button class="btn btn-outline-secondary" onclick="downloadTemplate()" id="downloadTemplateBtn">
                        <i class="bi bi-download"></i> 下載範本
                    </button>
                </div>
            </div>
        </div>

        <div class="card mb-4" id="previewSection" style="display: none;">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-eye"></i> 步驟二：資料預覽與選擇</h5>
            </div>
            <div class="card-body">
                <div id="projectsContainer"></div>
                <div class="mt-3 d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-primary" onclick="selectAllRecords()">
                        <i class="bi bi-check-square"></i> 全選
                    </button>
                    <button class="btn btn-outline-secondary" onclick="deselectAllRecords()">
                        <i class="bi bi-square"></i> 取消全選
                    </button>
                    <button class="btn btn-primary" onclick="exportWordSingle()">
                        <i class="bi bi-file-earmark-word"></i> 直接輸出 Word（單一計畫別）
                    </button>
                    <button class="btn btn-warning" onclick="exportWordAll()">
                        <i class="bi bi-file-earmark-zip"></i> 直接輸出 Word（所有計畫別）
                    </button>
                </div>
                <div class="mt-2 text-muted small">
                    系統會優先使用 Excel 的「起點地址 / 終點地址」產生 Google 地圖開車路線截圖；若有「連結」欄則作為備援。
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="projectSelectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">&#x9078;&#x64c7;&#x8981;&#x532f;&#x51fa;&#x7684;&#x8a08;&#x756b;&#x5225;</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="projectSelect" class="form-label">&#x8a08;&#x756b;&#x5225;</label>
                    <select class="form-select form-select-lg" id="projectSelect"></select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">&#x53d6;&#x6d88;</button>
                    <button type="button" class="btn btn-primary" onclick="confirmExportWordSingle()">
                        <i class="bi bi-file-earmark-word"></i> &#x532f;&#x51fa; Word
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">處理中...</span>
            </div>
            <p class="mt-3" id="loadingText">處理中...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = window.location.origin + '/api';
        let currentData = null;
        let currentFilepath = null;
        let fixedOrigin = '';

        function getToken() {
            return localStorage.getItem('jwt_token') || '';
        }

        function showLoading(text = '處理中...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show position-fixed`;
            toast.style.cssText = 'top: 20px; right: 20px; z-index: 10000; min-width: 320px;';
            toast.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            fixedOrigin = document.getElementById('fixedOrigin').value.trim();

            if (!file) {
                alert('請先選擇 Excel 檔案');
                return;
            }

            showLoading('正在上傳並解析 Excel 檔案...');
            try {
                const formData = new FormData();
                formData.append('file', file);
                if (fixedOrigin) formData.append('fixed_origin', fixedOrigin);

                const headers = {};
                const token = getToken();
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch(`${API_BASE_URL}/upload/excel`, {
                    method: 'POST',
                    headers,
                    body: formData,
                });

                if (!response.ok) {
                    let errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.message || errorMessage;
                    } catch (e) {}
                    throw new Error(errorMessage);
                }

                const result = await response.json();
                if (result.status !== 'success') {
                    throw new Error(result.message || '解析失敗');
                }

                currentData = result.data;
                currentFilepath = result.data.file_path;
                displayPreview(result.data);
                populateProjectSelect(result.data);
                document.getElementById('previewSection').style.display = 'block';
            } catch (error) {
                alert('上傳失敗: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        function populateProjectSelect(data) {
            const select = document.getElementById('projectSelect');
            if (!select) return;
            select.innerHTML = '';

            for (const [projectName, projectData] of Object.entries(data.projects || {})) {
                const option = document.createElement('option');
                option.value = projectName;
                option.textContent = `${projectName} (${projectData.count || projectData.records?.length || 0} 筆)`;
                select.appendChild(option);
            }
        }

        function displayPreview(data) {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';

            for (const [projectName, projectData] of Object.entries(data.projects)) {
                const projectBlock = document.createElement('div');
                projectBlock.className = 'project-block';
                projectBlock.innerHTML = `
                    <div class="project-header">
                        <i class="bi bi-folder"></i> ${projectName} (${projectData.count} 筆)
                    </div>
                    <div class="project-records" id="project-${projectName}"></div>
                `;

                const recordsContainer = projectBlock.querySelector(`#project-${projectName}`);
                projectData.records.forEach((record, idx) => {
                    const recordRow = document.createElement('div');
                    recordRow.className = 'record-row';
                    recordRow.id = `record-${projectName}-${idx}`;

                    const travelDate = record['出差日期時間（開始）'] || '';
                    const origin = record['起點名稱'] || record['起點地址'] || '';
                    const destination = record['目的地名稱'] || record['終點地址'] || '';
                    const mapLink = record['連結'] || record['GoogleMapUrl'] || '';

                    recordRow.innerHTML = `
                        <div class="d-flex align-items-center gap-3 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       id="select-${projectName}-${idx}"
                                       checked
                                       onchange="updateSelectStatus('${projectName}', ${idx}, this.checked)">
                                <label class="form-check-label" for="select-${projectName}-${idx}">
                                    <strong>${travelDate}</strong> ${origin} → ${destination}
                                </label>
                            </div>
                            ${mapLink ? `<a href="${mapLink}" target="_blank" class="btn btn-sm btn-link p-0">查看連結 <i class="bi bi-box-arrow-up-right"></i></a>` : ''}
                        </div>
                    `;

                    recordsContainer.appendChild(recordRow);
                });

                container.appendChild(projectBlock);
            }
        }

        function updateSelectStatus(projectName, idx, isSelected) {
        }

        function selectAllRecords() {
            if (!currentData) return;
            for (const [projectName, projectData] of Object.entries(currentData.projects)) {
                projectData.records.forEach((record, idx) => {
                    const checkbox = document.getElementById(`select-${projectName}-${idx}`);
                    if (checkbox) checkbox.checked = true;
                });
            }
        }

        function deselectAllRecords() {
            if (!currentData) return;
            for (const [projectName, projectData] of Object.entries(currentData.projects)) {
                projectData.records.forEach((record, idx) => {
                    const checkbox = document.getElementById(`select-${projectName}-${idx}`);
                    if (checkbox) checkbox.checked = false;
                });
            }
        }

        function collectSelectedRecords() {
            const allRecords = [];
            if (!currentData) return allRecords;
            for (const [projectName, projectData] of Object.entries(currentData.projects)) {
                projectData.records.forEach((record, idx) => {
                    const checkbox = document.getElementById(`select-${projectName}-${idx}`);
                    if (checkbox && checkbox.checked) {
                        allRecords.push({
                            ...record,
                            _projectName: projectName,
                            _index: idx,
                        });
                    }
                });
            }
            return allRecords;
        }

        function exportWordSingle() {
            if (!currentData) {
                alert('\u6c92\u6709\u8cc7\u6599\u53ef\u532f\u51fa');
                return;
            }

            const projectNames = Object.keys(currentData.projects);
            if (projectNames.length === 0) {
                alert('\u6c92\u6709\u8a08\u756b\u5225\u53ef\u532f\u51fa');
                return;
            }

            populateProjectSelect(currentData);
            const modalElement = document.getElementById('projectSelectModal');
            bootstrap.Modal.getOrCreateInstance(modalElement).show();
        }

        async function confirmExportWordSingle() {
            const projectSelect = document.getElementById('projectSelect');
            const projectName = projectSelect?.value;
            if (!projectName || !currentData?.projects?.[projectName]) {
                alert('\u8acb\u5148\u9078\u64c7\u8981\u532f\u51fa\u7684\u8a08\u756b\u5225');
                return;
            }

            bootstrap.Modal.getOrCreateInstance(document.getElementById('projectSelectModal')).hide();
            showLoading(`\u6b63\u5728\u7522\u751f ${projectName} \u7684 Word \u5831\u8868...`);
            try {
                const response = await fetch(`${API_BASE_URL}/export/word`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`,
                    },
                    body: JSON.stringify({
                        project_name: projectName,
                        records: currentData.projects[projectName].records,
                        fixed_origin: fixedOrigin,
                    }),
                });

                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message || 'Word \u532f\u51fa\u5931\u6557');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectName}_\u91cc\u7a0b\u5831\u8868.docx`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('\u532f\u51fa\u5931\u6557: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function exportWordAll() {
            if (!currentData) {
                alert('沒有資料可匯出');
                return;
            }

            showLoading('正在產生所有計畫別的 Word 報表...');
            try {
                const projects = {};
                for (const [projectName, projectData] of Object.entries(currentData.projects)) {
                    projects[projectName] = projectData.records;
                }

                const response = await fetch(`${API_BASE_URL}/export/word/batch`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`,
                    },
                    body: JSON.stringify({ projects, fixed_origin: fixedOrigin }),
                });

                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message || 'Word 匯出失敗');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `里程報表_${new Date().getTime()}.zip`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('匯出失敗: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function downloadTemplate() {
            const btn = document.getElementById('downloadTemplateBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>下載中...';

            try {
                const response = await fetch(`${API_BASE_URL}/export/template`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                    },
                });

                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message || '下載範本失敗');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '里程報表範本.xlsx';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showToast('範本下載成功', 'success');
            } catch (error) {
                showToast('下載失敗: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }
    </script>
</body>
</html>
